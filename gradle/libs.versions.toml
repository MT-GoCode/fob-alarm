[versions]
agp = "8.13.2"
kotlin = "2.1.0"
composeBom = "2025.01.00"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
concurrentFutures = "1.2.0"

[libraries]
core-ktx           = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime  = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity-compose   = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom        = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui         = { group = "androidx.compose.ui", name = "ui" }
compose-graphics   = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-tooling    = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3  = { group = "androidx.compose.material3", name = "material3" }
concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures", version.ref = "concurrentFutures" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
